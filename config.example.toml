# Beeper Minus configuration. Run with: beeper-minus config.toml
# Everything is optional.

# Where the SQLite database lives. Defaults to $STATE_DIRECTORY (systemd), else the working directory.
# state_dir = "/var/lib/beeper-minus"

[beeper]
# Beeper Client API, served by Beeper Server (headless) or Beeper Desktop.
url = "http://127.0.0.1:23373"
# File holding a read+write Beeper Client API token. Leave it unset to sign Beeper Server in from the
# web app's setup screen instead: the token it gets is kept in state_dir/beeper-token.
# token_file = "/run/secrets/beeper-token"

[web]
# Set to false to run headless (e.g. only transcribe voice notes into Note to self).
enable = true
# No authentication is built in: keep it on localhost, or put an authenticating reverse proxy in front.
host = "127.0.0.1"
port = 8099
# Names you open the web app with, besides localhost and `host`: a reverse proxy's domain, a Tailscale name...
# Requests for any other Host are refused, so another website can't reach the app through DNS rebinding.
# allowed_hosts = ["beeper.example.com"]
# Only let these Tailscale users in, as `tailscale serve` identifies them (Tailscale-User-Login). Then the
# app must only be reached through tailscale serve: requests without the header, or from tagged devices, are
# refused, and keep `host` on localhost so nobody can send the header themselves.
# allowed_users = ["you@github"]
# Serve an MCP endpoint at /mcp, so an AI assistant can search transcripts and schedule messages
# (Claude Code: claude mcp add --transport http beeper-minus https://<name>/mcp). Same access rules as the
# web app, and no login of its own: anything that can reach the app can use it. See SECURITY.md.
mcp = false

# Send later needs no configuration.

[transcription]
# "whisper-cpp" (local) or "openai" (any OpenAI-compatible speech-to-text API).
# Leave unset to turn transcription off entirely.
engine = "whisper-cpp"
# Transcribe incoming voice notes as they arrive. Without it, transcribe on demand from the web app.
auto = false
# Also post every transcript, automatic or requested from the web app, to your Note to self chat.
# Off: transcripts only show in the web app.
notes_to_self = false
# Beeper Minus finds Note to self on its own (the chat with only you in it). Set its ID if it can't.
# notes_to_self_chat_id = "!abcdefghijklmnop:beeper.com"
# Times in these notes use the server's time zone: set it to yours (NixOS: time.timeZone, else TZ).
# Automatic mode ignores voice notes older than this (account linking backfills old history).
max_age_days = 3

[transcription.whisper-cpp]
# A ggml model, e.g. https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin
model = "/var/lib/models/ggml-large-v3-turbo.bin"
# If the detected language isn't one of these, transcribe again forcing the first one.
# languages = ["fr", "en"]
# command = "whisper-cli"

[transcription.openai]
# url = "https://api.openai.com/v1/audio/transcriptions"   # or Groq, a local faster-whisper server...
# model = "whisper-1"
# api_key_file = "/run/secrets/openai-key"
# language = "fr"   # optional hint
